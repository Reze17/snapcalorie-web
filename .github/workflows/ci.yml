name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://snapcalorie:snapcalorie@localhost:5432/snapcalorie
      AUTH_SECRET: ci-only-secret-not-used-anywhere-else
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: snapcalorie
      S3_SECRET_ACCESS_KEY: snapcalorie123
      S3_BUCKET: snapcalorie-meals
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: snapcalorie
          POSTGRES_PASSWORD: snapcalorie
          POSTGRES_DB: snapcalorie
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U snapcalorie"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:migrate

      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=snapcalorie -e MINIO_ROOT_PASSWORD=snapcalorie123 \
            minio/minio server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 1
          done

      - name: Create MinIO bucket
        run: |
          node -e "
            const { S3Client, CreateBucketCommand, HeadBucketCommand } = require('@aws-sdk/client-s3');
            const client = new S3Client({ region: process.env.S3_REGION, endpoint: process.env.S3_ENDPOINT, forcePathStyle: true, credentials: { accessKeyId: process.env.S3_ACCESS_KEY_ID, secretAccessKey: process.env.S3_SECRET_ACCESS_KEY } });
            (async () => {
              try { await client.send(new HeadBucketCommand({ Bucket: process.env.S3_BUCKET })); }
              catch { await client.send(new CreateBucketCommand({ Bucket: process.env.S3_BUCKET })); }
            })();
          "

      - run: npm run test
      - run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - run: npm run e2e
